<body class="is-off">

    <!-- the compact Mac, front view -->
    <main class="mac" id="mac">
        <div class="mac-shell">
            <i class="shell-grain" aria-hidden="true"></i>
            <i class="shell-seam" aria-hidden="true"></i>

            <div class="bevel">
                <div class="recess">
                    <!-- empty: only measures where the glass sits inside the Mac -->
                    <div class="glass-slot" id="glassSlot"></div>
                </div>
            </div>

            <div class="chin">
                <svg class="logo" viewBox="0 0 64 78" width="36" height="44" aria-hidden="true">
                    <defs>
                        <linearGradient id="pearBody" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#7cf0e2"/><stop offset="0.5" stop-color="#27bdb2"/><stop offset="1" stop-color="#0f7770"/></linearGradient>
                        <linearGradient id="pearLeaf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0f7770"/><stop offset="1" stop-color="#40e0d0"/></linearGradient>
                    </defs>
                    <path d="M32 14C26 14 22.5 19 22.5 25c0 6-4 9.5-8 16C9 50 8.5 62 17 69c5 4.5 11 5.5 15 5.5s10-1 15-5.5c8.5-7 8-19 2.5-28-4-6.5-8-10-8-16 0-6-3.5-11-9.5-11z" fill="url(#pearBody)"/>
                    <path d="M32 14C32 9 34 5 38 2" fill="none" stroke="#5b4326" stroke-width="3.2" stroke-linecap="round"/>
                    <path d="M35.5 9C40 1 51 1.5 55 6c-4 8-14 9.5-19.5 3z" fill="url(#pearLeaf)"/>
                    <ellipse cx="24.5" cy="52" rx="3.3" ry="10" fill="#fff" opacity=".3" transform="rotate(12 24.5 52)"/>
                </svg>

                <div class="speaker" aria-hidden="true"></div>

                <div class="floppy" aria-hidden="true">
                    <i class="floppy-eject"></i>
                    <i class="floppy-slot"></i>
                    <i class="floppy-led"></i>
                </div>

                <i class="dial" aria-hidden="true"></i>
                <i class="power-led" aria-hidden="true"></i>
                <button class="power-key" id="powerKey" type="button" aria-label="Power on">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#3a3426" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3.5v8.2"/><path d="M7.1 6.6a8 8 0 1 0 9.8 0"/></svg>
                </button>

                <div class="sticky" aria-hidden="true"><span id="stickyText"></span></div>
            </div>
        </div>

        <!-- the glass is a sibling of the shell, so the plastic can fade away without taking the OS with it -->
        <div class="mac-glass" id="glass">
            <div class="screen" id="screen" role="application" aria-label="Marian OS desktop"></div>
            <div class="glass-fx" id="glassFx" aria-hidden="true">
                <i class="fx-scan"></i><i class="fx-roll"></i><i class="fx-vig"></i><i class="fx-sheen"></i><i class="fx-glare"></i><i class="fx-dead"></i>
            </div>
            <i class="crt-line" id="crtLine" aria-hidden="true"></i>
        </div>
    </main>

    <!-- viewport controls -->
    <div class="hud" id="hud">
        <button id="zoomBtn" type="button" aria-label="Fill the screen (F)" title="Fill the screen (F)">
            <svg data-expand viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>

        </button>
        <button id="soundBtn" type="button" aria-label="Sound on or off" title="Sound on or off">
            <svg data-on viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg>
