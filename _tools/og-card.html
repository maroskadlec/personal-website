<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Marian Kadlec — Share card</title>
    <link rel="stylesheet" href="../css/home.css">
    <style>
        html { width: 1200px; height: 630px; overflow: hidden; }
        body { width: 100%; height: 100%; padding-inline: 64px; }
        .site-header { padding-block: 28px 0; }
        .signature { inline-size: 195px; }
        main { grid-template-rows: 1fr; }
        .hero { gap: 24px; padding-block: 12px 40px; }
        .hero h1 { font-size: 120px; }
        .hero-intro { font-size: 30px; }
        .hero-outro { font-size: 21px; }
    </style>
</head>
<body>
    <header class="site-header"><img class="signature" src="../icons/marian-kadlec-wordmark.svg" width="691" height="195" alt="Marian Kadlec"></header>
    <main>
        <section class="hero">
            <p class="hero-intro">Product designer. Increasingly close to production.</p>
            <h1 aria-label="Design is the new code.">
                <span class="claim-line claim-line--sans" aria-hidden="true">Design is the</span>
                <span class="claim-line claim-line--serif" aria-hidden="true">new code.</span>
            </h1>
            <p class="hero-outro">Handoff is no longer the finish line.</p>
        </section>
    </main>
</body>
</html>
