<!doctype html>
<!-- The share card (variant b of _tools/og.mjs): what a link to the site shows when it is pasted into LinkedIn, Slack or a message.
     1200 x 630. It uses the fonts and colours of the machine, so serve the site over http and open /_tools/og-card.html. Not part of the published site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marian OS: share card</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #050403; }
    body { position: relative; color: #e9e4d3; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .glow { position: absolute; inset: 0; background: radial-gradient(540px 440px at 262px 315px, rgba(64, 224, 208, .22), rgba(64, 224, 208, 0) 72%); }
    .card { position: relative; display: grid; grid-template-columns: 400px 1fr; align-items: center; gap: 24px; height: 100%; padding: 0 64px 0 64px; }
    .pear { width: 368px; height: 368px; justify-self: center; filter: drop-shadow(0 0 34px rgba(64, 224, 208, .42)); }
    .kicker { font: 400 30px/1 'Jersey 10', monospace; letter-spacing: .1em; color: #40e0d0; text-transform: uppercase; }
    h1 { font: 400 176px/.84 'Jersey 10', monospace; color: #fff; margin: 20px 0 28px -4px; letter-spacing: .005em; text-shadow: 0 0 30px rgba(64, 224, 208, .28); }
    .role { font: 400 34px/1.25 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #a8c4bf; }
    .prompt { margin-top: 32px; font: 500 28px/1 'JetBrains Mono', ui-monospace, monospace; color: #40e0d0; white-space: nowrap; }
    .prompt i { display: inline-block; width: .6em; height: 1em; background: #40e0d0; vertical-align: -.14em; margin-left: .2em; }
    .url { position: absolute; right: 48px; top: 40px; font: 400 28px/1 'Jersey 10', monospace; color: #6c8a85; letter-spacing: .08em; }
    /* the glass: scanlines and a vignette, as on the screen */
    .glass { position: absolute; inset: 0; pointer-events: none; background:
        repeating-linear-gradient(to bottom, rgba(0, 0, 0, .2) 0 1px, rgba(0, 0, 0, 0) 1px 3px),
        radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, .55) 100%); }
</style>
</head>
<body>
<div class="glow"></div>
<main class="card">
    <img class="pear" src="../icons/icon.svg" alt="">
    <div>
        <p class="kicker">Marian OS 7.5.5</p>
        <h1>Marian<br>Kadlec</h1>
        <p class="role">Senior UX/UI Designer &amp; Product Designer</p>
        <p class="prompt">&gt; This portfolio is a computer.<i></i></p>
    </div>
</main>
<p class="url">mariankadlec.cz</p>
<div class="glass"></div>
</body>
</html>
